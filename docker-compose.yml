# ============================================
# DS-System Docker Compose 配置文件
# 用于生产环境部署
# ============================================

version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: ds-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: webtools
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - ds-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== 应用服务 (Flask + Vue) ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ds-app
    restart: always
    environment:
      # 数据库配置
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123456}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: webtools
      DATASHARE_DB_NAME: datashare
      # JWT配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      # Flask配置
      SECRET_KEY: ${SECRET_KEY:-your-flask-secret-key-change-in-production}
      DEBUG: "False"
      # 文件上传配置
      UPLOAD_FOLDER: /app/backend/uploads
      MAX_CONTENT_LENGTH: 100
    ports:
      - "${APP_PORT:-5001}:5001"
    volumes:
      - uploads_data:/app/backend/uploads
      - ./app.log:/app/app.log
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ds-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: ds-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - ds-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==================== 网络配置 ====================
networks:
  ds-network:
    driver: bridge
    name: ds-network

# ==================== 数据卷配置 ====================
volumes:
  mysql_data:
    name: ds-mysql-data
  uploads_data:
    name: ds-uploads-data
